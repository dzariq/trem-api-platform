# Optional: copy to sdks/typescript/.github/workflows/publish.yml
# after `gh auth refresh -h github.com -s write:packages,workflow`
name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dzariq"
      - run: npm install
      - run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
