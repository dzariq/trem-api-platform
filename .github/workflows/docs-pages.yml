name: Deploy API docs (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "openapi-admin.json"
      - "openapi.json"
      - "scripts/build-docs.sh"
      - ".github/workflows/docs-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-docs.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist
      - id: deployment
        uses: actions/deploy-pages@v4
