name: OpenAPI regression (Schemathesis)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1-5"
  pull_request:
    paths:
      - "openapi-admin.json"
      - "scripts/regression-test.sh"
      - "requirements-regression.txt"

permissions:
  contents: read

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure OpenAPI present
        env:
          TREM_API_BASE_URL: ${{ vars.TREM_API_BASE_URL }}
        run: |
          if [[ ! -f openapi-admin.json ]]; then
            bash scripts/fetch-openapi.sh
          fi

      - name: Run Schemathesis
        env:
          TREM_API_BASE_URL: ${{ vars.TREM_API_BASE_URL }}
          TREM_ADMIN_EMAIL: ${{ secrets.TREM_ADMIN_EMAIL }}
          TREM_ADMIN_PASSWORD: ${{ secrets.TREM_ADMIN_PASSWORD }}
          SCHEMATHESIS_MAX_EXAMPLES: "10"
          STRICT_REGRESSION: ${{ vars.STRICT_REGRESSION }}
        run: bash scripts/regression-test.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: artifacts/
