name: OpenAPI regression (Schemathesis)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1-5"
  pull_request:
    paths:
      - "openapi-admin.json"
      - "scripts/regression-test.sh"
      - "scripts/build-regression-report.py"
      - "scripts/attach-regression-to-docs.sh"
      - "requirements-regression.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/regression.yml"
      - "scripts/regression-test.sh"
      - "scripts/build-regression-report.py"
      - "scripts/attach-regression-to-docs.sh"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure OpenAPI present
        env:
          TREM_API_BASE_URL: ${{ vars.TREM_API_BASE_URL }}
        run: |
          if [[ ! -f openapi-admin.json ]]; then
            bash scripts/fetch-openapi.sh
          fi

      - name: Run Schemathesis
        env:
          TREM_API_BASE_URL: ${{ vars.TREM_API_BASE_URL }}
          TREM_ADMIN_EMAIL: ${{ secrets.TREM_ADMIN_EMAIL }}
          TREM_ADMIN_PASSWORD: ${{ secrets.TREM_ADMIN_PASSWORD }}
          SCHEMATHESIS_MAX_EXAMPLES: "10"
          STRICT_REGRESSION: ${{ vars.STRICT_REGRESSION }}
        run: bash scripts/regression-test.sh

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: artifacts/

      - name: Build docs site + attach regression UI
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash scripts/attach-regression-to-docs.sh

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy-report:
    needs: schemathesis
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
